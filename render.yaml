# Render Blueprint for the Estabizz Jobs AI service.
#
# STAGING ONLY. This describes one service: services/jobs-ai, the FastAPI
# resume text-extraction and structured-extraction worker that Vercel calls
# from the RESUME_PARSE queue handler. It deploys nothing else in this repo --
# the Next.js application stays on Vercel.
#
# Verified against the service before writing:
#   ASGI app object      app.main:app          (services/jobs-ai/app/main.py)
#   dependency file      requirements.txt      (pinned)
#   health endpoint      GET /health           (unauthenticated, no config disclosed)
#   protected endpoints  /internal/*           (x-estabizz-service-secret)

services:
  - type: web
    name: estabizz-jobs-ai-staging
    runtime: python
    region: singapore

    # FREE PLAN -- chosen deliberately for staging.
    #
    # Operational consequence: a free instance spins down after a period of
    # inactivity and cold-starts on the next request, which can take longer
    # than the caller's 45s text-extraction timeout
    # (JOBS_AI_TEXT_EXTRACTION_TIMEOUT_MS in lib/jobs/ai/config.ts).
    #
    # This degrades safely rather than losing work: an AI timeout is classified
    # retryable, the callback route returns 503, QStash re-delivers, and the
    # worker's atomic claim plus stale-processing reclaim make the retry safe.
    # The second delivery lands on a warm instance. Expect the first resume
    # after an idle period to take one extra retry cycle.
    #
    # Move to `starter` if that first-parse latency becomes unacceptable.
    plan: free

    branch: staging
    rootDir: services/jobs-ai
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit

    envVars:
      # Python floor is 3.11, not 3.9/3.10: app/api/resumes.py catches the
      # builtin TimeoutError from asyncio.wait_for, which only aliases
      # asyncio.TimeoutError from 3.11 onwards, and app/core/config.py uses
      # PEP 604 unions at runtime.
      #
      # This exact version was verified locally: a clean 3.13.15 venv built from
      # the pinned requirements.txt installs cleanly, imports app.main, and
      # passes all 39 tests. Any 3.13.x satisfies the floor, so if Render does
      # not offer this patch release, move to another 3.13.x -- no code change
      # is needed. Do not fall back to Render's default runtime.
      - key: PYTHON_VERSION
        value: 3.13.15

      # Drives the fail-closed docs switch in app/main.py. Anything other than
      # the literal "development" keeps /docs and /openapi.json hidden.
      - key: APP_ENV
        value: staging

      # Shared secret for x-estabizz-service-secret. Must be byte-identical to
      # AI_SERVICE_SECRET in the Vercel Preview environment. Set in the Render
      # dashboard; never committed.
      - key: AI_SERVICE_SECRET
        sync: false

      - key: OPENAI_API_KEY
        sync: false

      - key: JOBS_AI_PROVIDER
        value: openai
      - key: JOBS_AI_MODEL
        value: gpt-5.6-luna

      # Service-side ceilings. The Next.js caller allows each of these plus
      # network overhead -- see lib/jobs/ai/config.ts. Changing one side alone
      # reintroduces the caller-aborts-live-work mismatch.
      - key: JOBS_AI_TEXT_EXTRACTION_TIMEOUT_SECONDS
        value: "30"
      - key: JOBS_AI_EXTRACTION_TIMEOUT_SECONDS
        value: "60"

      # Must match JOBS_DOCUMENT_MAX_UPLOAD_MB on the Vercel side, otherwise the
      # two ends disagree about which uploads are too large.
      - key: JOBS_DOCUMENT_MAX_UPLOAD_MB
        value: "10"

      # --- malware scanning bridge --------------------------------------------
      # ClamAV is a PRIVATE service with no public URL, so Vercel cannot reach
      # it. jobs-ai is on Render's internal network and already authenticated,
      # so it forwards scans and returns only a verdict.
      #
      # fromService resolves the private address at deploy time, so the
      # hostname is never written down here and never leaves Render.
      #
      # DISABLED WHILE THE SCANNER IS DEFERRED (see the block at the end of this
      # file). A `fromService` reference to a service that does not exist fails
      # Blueprint validation, which would block every unrelated setting in this
      # file from being applied too.
      #
      # Leaving it unset is SAFE, not a weakening: services/jobs-ai/app/services/
      # malware_scanner.py returns `unavailable` / `scanner_not_configured` for
      # an empty value, and `unavailable` blocks. The bridge cannot report
      # `clean` without a scanner having actually inspected the bytes.
#|      - key: CLAMAV_INTERNAL_URL
#|        fromService:
#|          type: pserv
#|          name: estabizz-clamav-staging
#|          property: hostport

      # The scanner's own secret. Distinct from AI_SERVICE_SECRET, which guards
      # the bridge. Must match the value on estabizz-clamav-staging.
      - key: JOBS_MALWARE_SCANNER_SECRET
        sync: false

      - key: JOBS_MALWARE_SCAN_TIMEOUT_SECONDS
        value: "60"

      # DATABASE_URL is deliberately ABSENT and must stay absent.
      #
      # Confirmed by inspection: requirements.txt contains no database driver,
      # nothing under app/ imports psycopg / asyncpg / SQLAlchemy / Prisma, and
      # the only read of the value is bool(settings.database_url) for a boolean
      # on the authenticated /internal/health response. The service never opens
      # a connection. Giving a public AI worker Neon credentials it cannot use
      # would be pure exposure. All database access stays in Next.js on Vercel.

  # ===========================================================================
  # Private ClamAV scanner (STAGING) -- DEFERRED, NOT CANCELLED, NOT FAILED.
  #
  # Render Private Services have NO FREE TIER: every `pserv`, at every plan
  # size, requires a payment method on the account. None is available right
  # now, so the service cannot be created -- and a Blueprint that declares a
  # service it cannot create fails to sync, taking every other setting in this
  # file down with it.
  #
  # It is therefore DISABLED IN PLACE rather than deleted. The service code,
  # Dockerfile, tests and wire contract are unchanged and still pass. Only the
  # hosting is waiting on billing.
  #
  # THIS DOES NOT WEAKEN ANY SECURITY CONTROL. With no scanner reachable the
  # verdict is `not_configured` / `unavailable`, and both block. Production
  # forces `required = true` regardless of any environment variable
  # (resolveRequired in lib/jobs/malwareScanning/config.ts), so production
  # resume processing stays blocked until a real scanner is hosted. That is the
  # intent, and scripts/jobsMalwareScanningTest.mjs asserts it.
  #
  # TO RESTORE once a payment method exists, strip the `#|` marker from every
  # line that carries it -- here and on CLAMAV_INTERNAL_URL above:
  #
  #     sed -i '' 's/^#|//' render.yaml        # macOS; drop the '' on Linux
  #
  # The marker prefixes the original lines verbatim, so removing it reproduces
  # the working Blueprint byte for byte. Then sync: Render creates the scanner
  # first and resolves the `fromService` reference from it. Set
  # JOBS_MALWARE_SCANNER_SECRET to the same value on both services.
  #
  # Render is not the only option. services/jobs-clamav/docker-compose.yml runs
  # the identical container on any Docker host with >=1 GB RAM -- see
  # docs/jobs/28-PHASE6.3-DEPLOYMENT-CONTINGENCY.md.
  # ===========================================================================
#|  # ---------------------------------------------------------------------------
#|  # Private ClamAV scanner (STAGING).
#|  #
#|  # type: pserv -- a Private Service is reachable only from other services in
#|  # this Render account, never from the public internet. Candidate documents
#|  # must not traverse a public endpoint, and the scanner has no reason to be
#|  # addressable from outside.
#|  #
#|  # No production scanner is defined here. Production needs its own service and
#|  # its own secret, created deliberately rather than inherited from staging.
#|  # ---------------------------------------------------------------------------
#|  - type: pserv
#|    name: estabizz-clamav-staging
#|    runtime: docker
#|    region: singapore
#|    # ClamAV loads its full signature database into memory; below ~1 GB clamd
#|    # is killed on startup. This is the floor, not a performance preference.
#|    plan: standard
#|    branch: staging
#|    rootDir: services/jobs-clamav
#|    dockerfilePath: ./Dockerfile
#|    # No healthCheckPath: Render Private Services do not accept that field and
#|    # the Blueprint is rejected if it is present. The service still serves
#|    # GET /health -- it is used to confirm clamd is ready before pointing
#|    # jobs-ai at it, just not by the platform.
#|    autoDeployTrigger: commit
#|    envVars:
#|      # Same name and value as the application side, so there is one secret to
#|      # rotate rather than two that can drift apart.
#|      - key: JOBS_MALWARE_SCANNER_SECRET
#|        sync: false
#|
#|      # Must match JOBS_DOCUMENT_MAX_UPLOAD_MB on the Vercel side, or the two
#|      # ends disagree about which documents are too large.
#|      - key: JOBS_DOCUMENT_MAX_UPLOAD_MB
#|        value: "10"
#|
#|      # clamd runs beside the wrapper in the same container.
#|      - key: CLAMD_SOCKET
#|        value: /tmp/clamd.sock
#|      - key: CLAMD_TIMEOUT_SECONDS
#|        value: "60"
